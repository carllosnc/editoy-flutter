name: editoy
description: Image editor
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^6.0.0
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  json_annotation: ^4.8.1
  font_awesome_flutter: ^10.5.0
  shared_preferences: ^2.2.0
  reactive_preferences:
    git:
      url: https://github.com/carllosnc/reactive_preferences.git
  fluentui_system_icons: ^1.1.236
  fabric:
    git:
      url: https://github.com/carllosnc/fabric.git
  pro_image_editor: ^10.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  camera: ^0.11.1
  permission_handler: ^12.0.1
  image_gallery_saver_plus: ^4.0.1
  share_plus: ^11.0.0
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.4
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter:
  uses-material-design: true

  assets:
    - ./assets/images/welcome.png
    - ./assets/images/logo.png
    - ./assets/images/editing_image.png
    - ./assets/images/grid_images.png
    # grids
    - ./assets/images/grids/grid_1x2.png
    - ./assets/images/grids/grid_1x3.png
    - ./assets/images/grids/grid_2x1.png
    - ./assets/images/grids/grid_3x1.png
    - ./assets/images/grids/grid_2x2.png
    - ./assets/images/grids/grid_3x3.png
    - ./assets/images/grids/grid_t.png
    - ./assets/images/grids/grid_e.png
    - ./assets/images/grids/grid_item_placeholder.png
    - ./assets/images/polaroid.png
    - ./assets/images/polaroid_placeholder.png
    - ./assets/images/polaroid_texture.jpg
    - ./assets/images/polaroid_background_placeholder.jpg

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Ultralight.ttf
          weight: 100
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-UltralightItalic.ttf
          weight: 100
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Thin.ttf
          weight: 200
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-ThinItalic.ttf
          weight: 200
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Light.ttf
          weight: 300
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-LightItalic.ttf
          weight: 300
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Regular.ttf
          weight: 400
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Medium.ttf
          weight: 500
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Semibold.ttf
          weight: 600
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-SemiboldItalic.ttf
          weight: 600
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Bold.ttf
          weight: 700
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Heavy.ttf
          weight: 800
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-HeavyItalic.ttf
          weight: 800
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Black.ttf
          weight: 900
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-BlackItalic.ttf
          weight: 900
          style: italic
